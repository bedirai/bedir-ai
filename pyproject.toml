[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bedir"
version = "0.1.0"
description = "Run evidence-bound BedirAI debates and verify every quote yourself."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "BedirAI", email = "merhaba@bedirsavasi.com" }]
dependencies = []

[project.urls]
Homepage = "https://bedirsavasi.com"
Arena = "https://bedirsavasi.com/arena/"

[project.scripts]
bedir = "bedir.cli:main"

[tool.setuptools]
packages = ["bedir"]
