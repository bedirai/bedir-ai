[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bedir"
version = "0.2.0"
description = "Evidence-bound adversarial debate client, deterministic quote-hash verifier, RL reward functions, evaluation harness and compute planner for BedirAI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "BedirAI", email = "merhaba@bedirsavasi.com" }]
keywords = [
    "ai-safety",
    "scalable-oversight",
    "debate",
    "reinforcement-learning",
    "reward-modeling",
    "calibration",
    "verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://bedirsavasi.com"
Arena = "https://bedirsavasi.com/arena/"
Training = "https://bedirsavasi.com/training/"
Research = "https://bedirsavasi.com/research/"
Repository = "https://github.com/bedirai/bedir-ai"
Issues = "https://github.com/bedirai/bedir-ai/issues"

[project.scripts]
bedir = "bedir.cli:main"
bedir-eval = "bedir.eval:main"
bedir-compute = "training.compute_model:main"

[tool.setuptools]
packages = ["bedir", "training", "training.scaling"]
